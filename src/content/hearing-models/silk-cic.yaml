description: >-
  Πολύ διακριτικό CIC με μαλακή θήκη Silk, άνετη εφαρμογή και αόρατη εμφάνιση, ιδανικό
  για όσους θέλουν να «εξαφανίζεται» μέσα στον ακουστικό πόρο. Οι θήκες Click διατίθενται
  σε τέσσερα μεγέθη, σε ανοιχτό και κλειστό τύπο, ώστε να το φορέσετε αυθημερόν χωρίς
  εκμαγείο. Λειτουργεί με μπαταρία μεγέθους 10 και ρυθμίζεται από το Signia App.
