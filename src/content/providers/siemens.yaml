name: Siemens
description: >-
  Η Siemens, με μακρά παράδοση στην καινοτομία και την αξιοπιστία, προσφέρει ακουστικές
  λύσεις που καλύπτουν πλήρως τις σύγχρονες ανάγκες των ανθρώπων με απώλεια ακοής. Τα
  προϊόντα της χαρακτηρίζονται από ανθεκτικότητα, κομψό σχεδιασμό και ευκολία χρήσης,
  αποτελώντας σημείο αναφοράς για επαγγελματίες και τελικούς χρήστες παγκοσμίως. Επιπλέον,
  η Siemens δίνει έμφαση στην εξατομίκευση και τη συνεχή τεχνική υποστήριξη, προσφέροντας
  λύσεις για κάθε τρόπο ζωής. Ο κλάδος ακουστικών βαρηκοΐας της Siemens εξελίχθηκε στη σημερινή
  Signia, μέσα στον όμιλο WS Audiology. Γι' αυτό και οι δύο εταιρείες παραπέμπουν στον ίδιο
  ιστότοπο.
features:
  - Ακουστικά βαρηκοΐας με καινοτόμα φίλτρα θορύβου και ευκρίνεια ομιλίας.
  - Υψηλή αντοχή σε απαιτητικές συνθήκες και μακροζωία υλικών.
  - Εύχρηστοι μηχανισμοί ρύθμισης και προγράμματα για καθημερινές ή ειδικές ανάγκες.
  - Συμβατότητα με όλα τα σύγχρονα αξεσουάρ και συσκευές.
  - Διεθνές δίκτυο υποστήριξης και εγγύηση ποιότητας.
  - Συνεχής εξέλιξη τεχνολογιών για βέλτιστη εμπειρία ακοής.
  - Ειδικές σειρές για παιδιά, εφήβους και άτομα τρίτης ηλικίας.
  - Οικολογικές επιλογές μπαταρίας και αξεσουάρ.
