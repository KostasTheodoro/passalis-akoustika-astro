name: Rexton
description: >-
  Η Rexton παρέχει προσιτές, αξιόπιστες και αποδοτικές λύσεις για κάθε επίπεδο απώλειας
  ακοής, χωρίς συμβιβασμούς στην ποιότητα. Με στόχο να κάνει την ακοή προσβάσιμη σε όλους,
  η Rexton προσφέρει συσκευές που συνδυάζουν απλότητα στη χρήση, διακριτικότητα και
  τεχνολογικές καινοτομίες που απαντούν στις ανάγκες της καθημερινότητας. Η υποστήριξη και
  η φροντίδα προς τον πελάτη βρίσκεται πάντα στο επίκεντρο των υπηρεσιών της.
features:
  - Οικονομικές επιλογές χωρίς έκπτωση στην αξιοπιστία.
  - Ακουστικά κατάλληλα για όλες τις ηλικίες, ακόμα και για παιδιά.
  - Απλός και γρήγορος προγραμματισμός από τον ειδικό ακοολόγο.
  - Ανθεκτική κατασκευή και χαμηλό κόστος συντήρησης.
  - Δυνατότητα σύνδεσης με smartphones και tablets.
  - Άμεση τεχνική υποστήριξη και εκτεταμένη εγγύηση.
  - Ευρεία γκάμα αξεσουάρ για κάθε απαίτηση.
  - Λύσεις για εργασία, ψυχαγωγία και αθλητικές δραστηριότητες.
